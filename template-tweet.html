<!doctype html><html><head><meta charset="utf-8">
<title>Tweet Carousel</title>
<!--
  TWEET-STYLE CAROUSEL  (ig-carousel skill, template "tweet")
  Modelled on the Hormozi tweet decks: one tweet card per slide, nothing else.
  Two looks, chosen per slide:
    plain  -> white slide, header top-left, one big statement
    photo  -> full-bleed photo, white card bottom-left with the header + text
  The cover (first slide) gets the circle arrow. Text auto-shrinks to fit.
  EDIT ZONE = slidesData only. Design is locked. Profile is always Skyleigh McCallum.
-->
<style>
@font-face{font-family:'Inter';src:url('carousel-assets/inter.woff2') format('woff2');font-weight:100 900;font-display:block;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#222;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
.slide{position:relative;width:1080px;height:1350px;background:#fff;overflow:hidden;}
.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.slide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.28) 100%);}
/* header */
.hd{display:flex;align-items:center;gap:28px;}
.hd .av{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:0 0 auto;}
.hd .who{display:flex;flex-direction:column;gap:4px;}
.hd .nm{font-weight:800;font-size:60px;letter-spacing:-.01em;color:#0f1419;display:flex;align-items:center;gap:8px;line-height:1.1;}
.hd .nm svg{width:52px;height:52px;flex:0 0 auto;}
.hd .hn{font-weight:400;font-size:42px;color:#536471;line-height:1.1;}
/* plain */
.plain .hd{position:absolute;top:100px;left:96px;right:96px;}
.plain .txt{position:absolute;top:340px;left:96px;right:96px;bottom:150px;font-size:88px;line-height:1.16;letter-spacing:-.02em;color:#0f1419;font-weight:400;white-space:pre-line;overflow:hidden;}
/* photo card */
.card{position:absolute;left:56px;right:290px;bottom:56px;background:#fff;border-radius:28px;padding:40px 44px 44px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
.card .hd{margin-bottom:26px;gap:22px;}
.card .hd .av{width:96px;height:96px;}
.card .hd .nm{font-size:40px;}
.card .hd .hn{font-size:30px;}
.card .txt{font-size:42px;line-height:1.3;letter-spacing:-.015em;color:#0f1419;white-space:pre-line;max-height:560px;overflow:hidden;}
.card .arrow{position:absolute;right:40px;bottom:40px;width:64px;height:64px;border:3px solid #0f1419;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.card .arrow svg{width:32px;height:32px;}
</style></head><body>
<script>
/* ==================== EDIT ZONE ==================== */
const PROFILE_KEY = 'skyleigh';          // always Skyleigh: tweet decks are her personal voice, never the Elevation brand (D, 2026-09-10)
const slidesData = [
  { photo:'skyleigh-1.jpg', text:'Sellers spend weeks picking paint colours and five minutes picking their list price.\n\nThe 5 things I check before we pick a number:' },
  { photo:'skyleigh-2.jpg', text:'1) What sold below you, and what is sitting above you.' },
  { photo:'skyleigh-3.jpg', text:'2) Every update since the last sale. Roof, furnace, kitchen, flooring. The online estimate never saw any of it.' },
  { photo:'skyleigh-1.jpg', text:'3) Months of inventory in your segment. That tells us who has the leverage.' },
  { photo:'skyleigh-2.jpg', text:'4) The season. Winter has fewer buyers. Spring has more of them, and more competition.' },
  { photo:'skyleigh-3.jpg', text:'5) Your timeline. A fast sale and a top-dollar sale are two different prices.' },
  { text:'Want the real number on your home?\n\nComment PRICE.' },
];
/* =================================================== */

const ASSETS = 'carousel-assets/';   // served by render.mjs from this skill's assets/ folder, wherever the deck file lives
const PROFILES = {
  skyleigh:  { name:'Skyleigh McCallum',     handle:'@skyleighmccallum',        avatar:'skyleigh-avatar.png',  verified:true },
};
const P = PROFILES[PROFILE_KEY];
const TICK = '<svg viewBox="0 0 24 24"><path fill="#1d9bf0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>';
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="#0f1419" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const header = () => '<div class="hd"><img class="av" src="'+ASSETS+P.avatar+'"><div class="who"><div class="nm">'+P.name+(P.verified?TICK:'')+'</div><div class="hn">'+P.handle+'</div></div></div>';

slidesData.forEach((d,i)=>{
  const s=document.createElement('div');
  if(d.photo){
    s.className='slide photo';
    s.innerHTML='<img class="bg" src="'+ASSETS+'photos/'+d.photo+'"><div class="shade"></div>'+
      '<div class="card">'+header()+'<div class="txt">'+d.text+'</div>'+(i===0?'<div class="arrow">'+ARROW+'</div>':'')+'</div>';
  }else{
    s.className='slide plain';
    s.innerHTML=header()+'<div class="txt">'+d.text+'</div>';
  }
  document.body.appendChild(s);
});
// auto-fit: shrink until the text fits its box
function fit(){
  document.querySelectorAll('.txt').forEach(t=>{
    const plain=t.closest('.plain'); let size=plain?88:42; const min=plain?46:30;
    t.style.fontSize=size+'px';
    const max=plain?t.clientHeight:560;
    while(t.scrollHeight>max && size>min){ size-=2; t.style.fontSize=size+'px'; }
  });
  // cover card: keep the arrow clear of the last text line
  document.querySelectorAll('.card .arrow').forEach(a=>{ a.parentElement.style.paddingBottom='120px'; });
}
document.fonts ? document.fonts.ready.then(fit) : fit();
</script>
</body></html>
