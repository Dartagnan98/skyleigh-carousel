  /* warm wash + soft top glow */
  .slide .wash{
    position:absolute;inset:0;
    background:
      radial-gradient(60% 36% at 26% 16%, rgba(235,69,17,.07) 0%, rgba(235,69,17,0) 70%),
      radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 55%);
  }
  .content{position:absolute;inset:0;z-index:3;}

  /* corner brackets */
  .brk{display:none;}
  .brk.tl{top:14px;left:14px;border-top:2.4px solid #CE823E;border-left:2.4px solid #CE823E;}
  .brk.bl{bottom:14px;left:14px;border-bottom:2.4px solid #CE823E;border-left:2.4px solid #CE823E;}
  .brk.br{bottom:14px;right:14px;border-bottom:2.4px solid #CE823E;border-right:2.4px solid #CE823E;}

  /* top bar */
  .topbar{
    position:absolute;top:24px;left:30px;right:30px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Recoleta','Archivo',serif;
    font-size:12px;font-weight:400;letter-spacing:1px;
  }
  .topbar .brand{display:flex;align-items:center;font-family:'Open Sauce Sans','Manrope',sans-serif;font-weight:900;font-size:9px;letter-spacing:.16em;color:#044B35;}
  .topbar .brand svg{height:21px;width:auto;display:block;}
  .topbar .count{color:#669286;}
  .topbar .count b{color:#CE823E;font-weight:700;}

  /* kicker */
  .kicker{
    position:absolute;top:50px;left:30px;
    font-family:'Manrope',sans-serif;
    font-size:9.5px;font-weight:800;letter-spacing:.14em;
    color:#fff;background:#CE823E;
    padding:5px 10px;border-radius:999px;
    text-transform:uppercase;
  }

  /* headline */
  .hl{
    position:absolute;left:30px;right:30px;top:84px;
    font-family:'Open Sauce Sans','Manrope','Archivo','Arial Black',sans-serif;font-weight:900;letter-spacing:-.015em;
    font-weight:700;
    font-size:47px;
    line-height:.92;
    letter-spacing:-.5px;
    color:#2B2B2B;
    text-transform:uppercase;
  }
  .hl .o{color:#CE823E;}
  .slide.cover .hl{font-size:37px;line-height:.94;top:84px;}

  /* sub */
  .sub{
    position:absolute;left:30px;right:96px;
    font-family:'Recoleta','Archivo',serif;
    font-weight:400;
    font-size:16.5px;
    line-height:1.4;
    letter-spacing:.1px;
    color:#4d5a55;
  }
  .sub b{color:#2B2B2B;font-weight:400;}

  /* sparkle */
  .spark{
    position:absolute;left:30px;
    width:16px;height:16px;color:#CE823E;
  }

  /* terminal card */
  .term{
    position:absolute;left:30px;
    width:348px;
    background:rgba(255,255,255,.92);
    border:1px solid rgba(206,130,62,.28);
    border-radius:18px;
    box-shadow:0 18px 40px -18px rgba(27,42,74,.28);
    overflow:hidden;
    z-index:4;
  }
  .term .bar{
    height:6px;
    background:linear-gradient(90deg,#CE823E,rgba(206,130,62,.35));
  }
  .term .bar i,.term .bar span{display:none;}
  .term .body{padding:16px 20px 18px;}
  .term .ln{
    font-family:'Manrope',sans-serif;
    font-size:12.5px;line-height:1.5;
    padding:5px 0;
    color:#2B2B2B;
    display:flex;align-items:center;gap:10px;
    white-space:nowrap;
  }
  .term .ln .c,.term .ln .a,.term .ln .ok{
    flex:0 0 auto;width:18px;height:18px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;
  }
  .term .ln.t{
    font-family:'Recoleta',serif;font-size:15.5px;color:#2B2B2B;
    padding:0 0 8px;margin-bottom:6px;
    border-bottom:1px solid rgba(27,42,74,.10);
  }
  .term .ln.t .c{background:#CE823E;color:#fff;font-size:11px;}
  .term .ln .a{background:rgba(206,130,62,.16);color:#CE823E;font-size:12px;}
  .term .ln.k{font-weight:700;color:#2B2B2B;}
  .term .ln .ok{background:#CE823E;color:#fff;font-weight:800;}
  .term .ln strong{color:#fff;font-weight:500;}

  /* clay figure */
  .figure{
    position:absolute;z-index:5;
    bottom:128px;right:4px;
    height:206px;
    filter:drop-shadow(0 12px 16px rgba(40,20,5,.32));
  }
  .slide.cover .figure{height:250px;bottom:56px;}


  /* scroll-stopper: cover + outro go dark brand colour, everything on them flips to white */
  .slide.cover,.slide.outro{background:#044B35;}
  .slide.cover .pcb,.slide.outro .pcb{opacity:.06;filter:invert(1);}
  .slide.cover .wash,.slide.outro .wash{background:radial-gradient(70% 45% at 30% 10%, rgba(206,130,62,.22) 0%, rgba(206,130,62,0) 70%);}
  .slide.cover .topbar .brand,.slide.outro .topbar .brand{color:#fff;}
  .slide.cover .topbar .count,.slide.outro .topbar .count{color:rgba(255,255,255,.55);}
  .slide.cover .hl,.slide.outro .hl{color:#fff;}
  .slide.cover .sub,.slide.outro .sub{color:rgba(255,255,255,.78);right:128px;}
  .slide.cover .sub b,.slide.outro .sub b{color:#fff;}
  .slide.cover .term,.slide.outro .term{background:#F7F7F7;border-color:rgba(255,255,255,.35);box-shadow:0 22px 44px -18px rgba(0,0,0,.55);}
  .slide.cover .wm,.slide.outro .wm{color:rgba(255,255,255,.28);}
  .slide.cover .foot .fname,.slide.outro .foot .fname{color:#fff;}
  .slide.cover .foot .av,.slide.outro .foot .av{box-shadow:0 0 0 2px rgba(255,255,255,.6);}
  .slide.cover .figure,.slide.outro .figure{filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));}
  /* watermark */
  .wm{
    position:absolute;left:0;right:0;
    bottom:56px;
    text-align:center;
    font-family:'Manrope',sans-serif;font-weight:700;
    font-size:9px;letter-spacing:2px;
    color:rgba(80,72,54,.34);
  }

  /* footer */
  .foot{
    position:absolute;left:30px;bottom:26px;
    display:flex;align-items:center;gap:8px;
    z-index:6;
  }
  .foot .av{
    width:26px;height:26px;border-radius:50%;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .foot .av img{width:26px;height:26px;object-fit:cover;display:block;}
  .foot .fname{
    font-family:'Archivo',sans-serif;
    font-weight:700;font-size:11.5px;
    color:#2B2B2B;
  }
  .foot .vf{width:13px;height:13px;}

  /* swipe arrow */
  .swipe{
    position:absolute;right:24px;bottom:22px;z-index:6;
    width:46px;height:24px;
  }

  /* nav */
  .dots{display:flex;justify-content:center;gap:7px;margin-top:16px;}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,.2);border:0;cursor:pointer;padding:0;
    transition:background .2s,transform .2s;
  }
  .dot.on{background:#CE823E;transform:scale(1.3);}
  .arrow{
    position:absolute;top:50%;z-index:9;transform:translateY(-50%);
    width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(20,16,10,.4);color:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s,opacity .2s;
  }
  .arrow:hover{background:rgba(20,16,10,.7);}
  .arrow.prev{left:10px;}
  .arrow.next{right:10px;}
  .arrow.hidden{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<div class="frame">
  <div class="viewport">
    <div class="track" id="track">
      <!-- slides injected by script -->
    </div>
    <button class="arrow prev hidden" id="prev" aria-label="Previous">&#10094;</button>
    <button class="arrow next" id="next" aria-label="Next">&#10095;</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const SPARK = '<svg class="spark" viewBox="0 0 24 24" fill="currentColor" style="TOP"><path d="M12 0c.6 5.4 2.6 7.4 12 12-9.4 4.6-11.4 6.6-12 12-.6-5.4-2.6-7.4-12-12 9.4-4.6 11.4-6.6 12-12z"/></svg>';
  const VERIF = '<svg class="vf" viewBox="0 0 24 24"><path fill="#3897f0" d="M12 1l2.4 2.1 3.2-.3 1.3 2.9 2.9 1.3-.3 3.2L24 12l-2.1 2.4.3 3.2-2.9 1.3-1.3 2.9-3.2-.3L12 23l-2.4-2.1-3.2.3-1.3-2.9L2.2 17l.3-3.2L0 12l2.1-2.4-.3-3.2 2.9-1.3L6 2.2l3.2.3z"/><path fill="#fff" d="M10.6 14.6l-2.5-2.5-1.4 1.4 3.9 3.9 7-7-1.4-1.4z"/></svg>';
  const SWIPE = '<svg class="swipe" viewBox="0 0 60 30" fill="none" stroke="#CE823E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21 C 18 21, 30 17, 44 9"/><path d="M35 7 L46 8 L42 19"/></svg>';
  const LOGO = '<svg viewBox="0 0 48 48" fill="none"><path d="M24 9 41 39H30L24 28 18 39H7Z" fill="#F7F7F7"/><path d="M24 9 30 21 24 30 18 21Z" fill="#CE823E"/></svg>';
  const LOGO_DARK = '<svg viewBox="0 0 48 48" fill="none"><path d="M24 9 41 39H30L24 28 18 39H7Z" fill="#2B2B2B"/><path d="M24 9 30 21 24 30 18 21Z" fill="#CE823E"/></svg>';

  /* Clay-Skyleigh poses. The cover always points up at the headline; every
     other slide auto-rotates through this set (poses face the content,
     which sits to her left). Do not hand-assign poses per slide. */
  const COVER_POSE = 'skyleigh-point-trim.png';
  const POSE_CYCLE = ['skyleigh-present-trim.png','skyleigh-pointleft-trim.png','skyleigh-thumb-trim.png'];

  /* ==========================================================
     EDIT ZONE — this is the ONLY thing you change per carousel.
     ----------------------------------------------------------
     Each slide object:
       cover : true   -> first slide (big headline, points up)
       outro : true   -> last slide  (CTA / comment slide)
       kicker: short orange mono label (e.g. 'MOVE 01')
       hl    : headline. Wrap punch words in <span class="o">..</span>
               to make them orange. Auto-uppercased.
       sub   : Recoleta serif sub-line. Wrap key phrase in <b>..</b>.
       term  : terminal lines, each [cls, symbol, strong, text]
               cls: 'c' orange cmd | 'a' dim arrow | 'ok' green check
               strong: 'strong' = white bold text, '' = normal
               keep text <= 38 chars (mono lines do not wrap)
     Slide number + total and the figure pose are automatic.
     ========================================================== */
  const slidesData = [
    { cover:true, kicker:'BEFORE YOU LIST',
      hl:'Your home gets <span class="o">one first week</span> on the market.',
      sub:'Price it right before then, or the market prices it for you. <b>The 5 checks I run before we pick a number.</b>',
      term:[
        ['c','$ ','','The 5 checks'],
        ['a','→ ','','Photos, updates, comps'],
        ['a','→ ','','Market type, then the price'],
        ['ok','✓ ','strong','priced to sell, not to sit'] ] },

    { kicker:'STEP 01',
      hl:'Fresh <span class="o">photos</span>',
      sub:'MLS photos from the last sale are years old. <b>I walk the home and shoot it as it is today.</b>',
      term:[
        ['c','$ ','','Fresh photos'],
        ['a','→ ','','every room, as it stands now'],
        ['a','→ ','','not the old listing shots'],
        ['ok','✓ ','strong','what buyers will actually see'] ] },

    { kicker:'STEP 02',
      hl:'Every <span class="o">update</span> counts',
      sub:'Roof, furnace, kitchen, flooring. <b>Anything done since the last sale moves the number.</b>',
      term:[
        ['c','$ ','','Every update counts'],
        ['a','→ ','','since the last sale'],
        ['a','→ ','','what changed, what it cost'],
        ['ok','✓ ','strong','value the estimate never saw'] ] },

    { kicker:'STEP 03',
      hl:'The <span class="o">comps</span>, honestly',
      sub:'I go through each comparable with you. <b>You decide if it is better or worse than yours.</b>',
      term:[
        ['c','$ ','','The comps, honestly'],
        ['a','→ ','','recent sales, same pocket'],
        ['a','→ ','','my read on every one'],
        ['ok','✓ ','strong','some with a grain of salt'] ] },

    { kicker:'STEP 04',
      hl:'Read the <span class="o">market</span>',
      sub:'Absorption rate tells us who has the leverage. <b>Buyers, sellers, or balanced.</b>',
      term:[
        ['c','$ ','','Read the market'],
        ['a','→ ','','months of inventory'],
        ['a','→ ','','winter vs spring buyers'],
        ['ok','✓ ','strong','we know the market type'] ] },

    { kicker:'STEP 05',
      hl:'Sandwich <span class="o">pricing</span>',
      sub:'A high, a low, and where I would land. <b>You weigh in before anything is final.</b>',
      term:[
        ['c','$ ','','Sandwich pricing'],
        ['a','→ ','','ceiling / floor / my pick'],
        ['a','→ ','','your call on the final'],
        ['ok','✓ ','strong','listed with a plan'] ] },

    { kicker:'YOUR NEXT MOVE', outro:true,
      hl:'Want the <span class="o">real number</span> on your home?',
      sub:'Comment <b>PRICE</b> and I will run these 5 checks on your home before you talk to anyone. <b>Free, no listing required.</b>',
      term:[
        ['c','$ ','','Your next move'],
        ['a','→ ','','Free, no obligation'],
        ['a','→ ','','Kamloops + Okanagan Shuswap'],
        ['ok','✓ ','strong','Comment PRICE'] ] }
  ];
  /* ===================== END EDIT ZONE ===================== */

  const track = document.getElementById('track');

  const TOTAL = String(slidesData.length).padStart(2,'0');

  slidesData.forEach((d,i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (d.cover ? ' cover' : '') + (d.outro ? ' outro' : '');

    const count = String(i+1).padStart(2,'0');
    const pose  = d.cover ? COVER_POSE : POSE_CYCLE[(i-1) % POSE_CYCLE.length];

    const SYM = { c:'✦', a:'•', ok:'✓' };            // soft card: title spark, dot bullets, check
    const termLines = d.term.map(([cls,sym,strong,txt]) => {
      const row = cls === 'c' ? 'ln t' : cls === 'ok' ? 'ln k' : 'ln';
      const cap = txt.charAt(0).toUpperCase() + txt.slice(1);   // sentence case every card line
      return '<div class="'+row+'"><span class="'+cls+'">'+SYM[cls]+'</span><span>'+cap+'</span></div>';
    }).join('');

    // vertical rhythm (fallback values; refined by layout() after fonts load)
    const subTop  = d.cover ? 268 : 150;
    const sparkTop= d.cover ? 318 : 196;
    const termTop = d.cover ? 344 : 224;

    s.innerHTML =
      '<div class="pcb"></div>'+
      '<div class="wash"></div>'+
      '<div class="content">'+
        '<div class="topbar">'+
          '<span class="brand">SKYLEIGH McCALLUM</span>'+
          '<span class="count"><b>'+count+'</b> / '+TOTAL+'</span>'+
        '</div>'+
        '<div class="kicker">'+d.kicker+'</div>'+
        '<h2 class="hl">'+d.hl.toUpperCase().replace('CLASS="O"','class="o"')+'</h2>'+
        '<p class="sub" style="top:'+subTop+'px">'+d.sub+'</p>'+
        SPARK.replace('TOP','top:'+sparkTop+'px')+
        '<div class="term" style="top:'+termTop+'px"><div class="bar">'+
          '<i class="r"></i><i class="y"></i><i class="g"></i>'+
          '<span>skyleigh — zsh</span></div>'+
          '<div class="body">'+termLines+'</div></div>'+
        '<img class="figure" src="carousel-assets/'+pose+'" alt="">'+
        '<div class="wm">@skyleighmccallum</div>'+
        '<div class="foot"><span class="av"><img src="carousel-assets/skyleigh-avatar.png" alt=""></span>'+
          '<span class="fname">skyleighmccallum</span></div>'+
        SWIPE+
        '<span class="brk tl"></span><span class="brk bl"></span><span class="brk br"></span>'+
      '</div>';
    track.appendChild(s);
  });

  const slides = [...track.children];
  const total  = slides.length;
  const SLIDE_W = 432;

  // Flow sub / sparkle / terminal below the actual rendered headline so
  // 1-line and 2-line headlines never collide with the sub copy.
  function layout(){
    slides.forEach(s=>{
      const cover = s.classList.contains('cover');
      const hl    = s.querySelector('.hl');
      const sub   = s.querySelector('.sub');
      const spark = s.querySelector('.spark');
      const term  = s.querySelector('.term');
      if(!hl||!sub||!spark||!term) return;
      const hlTop  = cover ? 80 : 84;
      const subTop = hlTop + hl.offsetHeight + (cover ? 22 : 20);
      sub.style.top = subTop + 'px';
      const sparkTop = subTop + sub.offsetHeight + 15;
      spark.style.top = sparkTop + 'px';
      let termTop = sparkTop + 30;
      // never let the card run into the footer: tighten, then shrink type, then shrink the card, until it clears 482
      const maxBot = 482;
      const fits = () => termTop + term.offsetHeight <= maxBot;
      const reflow = (gapSub, gapSpark, gapTerm) => {
        sub.style.top = (hlTop + hl.offsetHeight + gapSub) + 'px';
        const st = hlTop + hl.offsetHeight + gapSub + sub.offsetHeight;
        spark.style.top = (st + gapSpark) + 'px';
        termTop = Math.max(st + gapTerm, maxBot - term.offsetHeight);
      };
      if(!fits()) reflow(12, 8, 14);
      if(!fits()){ spark.style.display='none'; reflow(10, 0, 12); }
      let subPx = parseFloat(getComputedStyle(sub).fontSize);
      while(!fits() && subPx > 13.5){ subPx -= 0.5; sub.style.fontSize = subPx + 'px'; reflow(10, 0, 12); }
      let hlPx = parseFloat(getComputedStyle(hl).fontSize);
      while(!fits() && hlPx > 34){ hlPx -= 1; hl.style.fontSize = hlPx + 'px'; reflow(10, 0, 12); }
      let lnPad = 5;
      while(!fits() && lnPad > 1){ lnPad -= 1; term.querySelectorAll('.ln').forEach(l => l.style.padding = lnPad + 'px 0'); reflow(10, 0, 12); }
      if(!fits()){ const k = (maxBot - termTop) / term.offsetHeight; term.style.transformOrigin = 'left top'; term.style.transform = 'scale(' + k.toFixed(3) + ')'; }
      term.style.top = termTop + 'px';
      s.dataset.cardBottom = Math.round(termTop + term.offsetHeight * (term.style.transform ? parseFloat(term.style.transform.slice(6)) : 1));
      s.dataset.maxBot = maxBot;
      s.dataset.cardScale = term.style.transform ? parseFloat(term.style.transform.slice(6)) : 1;
    });
  }
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(layout); }
  setTimeout(layout, 400);
  setTimeout(layout, 1200);
  const dotsWrap= document.getElementById('dots');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let index = 0;

  slides.forEach((_,i)=>{
    const b=document.createElement('button');
    b.className='dot'+(i===0?' on':'');
    b.addEventListener('click',()=>goTo(i));
    dotsWrap.appendChild(b);
  });
  const dots=[...dotsWrap.children];

  function goTo(i){
    index=Math.max(0,Math.min(total-1,i));
    track.style.transform='translateX('+(-index*SLIDE_W)+'px)';
    dots.forEach((d,n)=>d.classList.toggle('on',n===index));
    prev.classList.toggle('hidden',index===0);
    next.classList.toggle('hidden',index===total-1);
  }
  prev.addEventListener('click',()=>goTo(index-1));
  next.addEventListener('click',()=>goTo(index+1));
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')goTo(index-1);
    if(e.key==='ArrowRight')goTo(index+1);
  });
  let sx=0;
  track.addEventListener('pointerdown',e=>sx=e.clientX);
  track.addEventListener('pointerup',e=>{
    const dx=e.clientX-sx;
    if(dx<-45)goTo(index+1);
    if(dx>45)goTo(index-1);
  });
  goTo(0);
</script>
</body>
</html>
